<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dope à Mines · Visio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0d1a;color:#e8e8f0;font-family:Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
#bar{background:#161628;border-bottom:1px solid #333;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#bar h1{font-size:16px;font-weight:bold;flex:1;color:#e8e8f0}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #444;background:#1e1e35;color:#e8e8f0}
.btn:hover{background:#2a2a4a}
.btn:disabled{opacity:0.3;cursor:not-allowed}
#btn-die{background:#c0392b;border-color:#c0392b;color:#fff;font-size:15px}
#btn-die:hover:not(:disabled){background:#a93226}
#turn{font-size:12px;color:#888}
#main{display:flex;flex:1;overflow:hidden}
#board-area{flex:1;display:flex;align-items:center;justify-content:center;padding:10px}
#board-area svg{max-width:100%;max-height:100%}
#side{width:270px;background:#161628;border-left:1px solid #222;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.box{background:#1e1e35;border-radius:8px;padding:10px}
.box-t{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:6px}
#die-show{font-size:40px;text-align:center}
#case-info{font-size:11px;color:#888;text-align:center;margin-top:3px}
.no-c{color:#666;font-size:12px;text-align:center;padding:10px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:bold;margin-bottom:5px}
.ctitle{font-size:17px;font-weight:bold;margin-bottom:4px}
.csit{font-size:11px;color:#aab;font-style:italic;margin-bottom:4px;line-height:1.4}
.cbrain{font-size:10px;color:#666;margin-bottom:7px;line-height:1.4}
.pills{display:flex;gap:6px;margin-bottom:5px}
.pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.da{background:#1a3a5c;color:#5dade2}
.co{background:#4a0f0f;color:#e74c3c}
.score-pill{font-size:11px;font-weight:bold;padding:3px 10px;border-radius:6px;display:inline-block}
.effet{margin-top:6px;padding:5px;background:#2e2000;color:#f0b27a;border-radius:5px;font-size:10px;line-height:1.4}
.parole{margin-top:6px;padding:5px;background:#1e0a3d;color:#af7ac5;border-radius:5px;font-size:10px;line-height:1.4;font-style:italic}
.prow{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:5px}
.prow.cur{background:#ffffff10}
.pdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.pn{font-size:11px;flex:1}
.pp{font-size:10px;color:#666}
.ps{font-size:12px;font-weight:bold}
#pontda{padding:6px;border-radius:6px;font-size:11px;font-weight:bold;text-align:center;background:#1a1a2e;color:#666}
.leg{display:flex;flex-wrap:wrap;gap:5px}
.li{display:flex;align-items:center;gap:3px;font-size:10px;color:#888}
.ld{width:9px;height:9px;border-radius:50%}
</style>
</head>
<body>
<div id="app">
<div id="bar">
  <h1>DOPE À MINES · ADULTES · VISIO</h1>
  <span id="turn">Tour 1 · Joueur 1</span>
  <button class="btn" id="btn-die" onclick="lancerDe()">🎲 Lancer le dé</button>
  <button class="btn" id="btn-draw" onclick="piocher()" disabled>Piocher</button>
  <button class="btn" id="btn-next" onclick="tourSuivant()" disabled>Tour suivant</button>
  <button class="btn" onclick="resetJeu()">↺ Reset</button>
</div>
<div id="main">
  <div id="board-area">
    <svg id="svg" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="side">
    <div class="box">
      <div class="box-t">Dé</div>
      <div id="die-show">—</div>
      <div id="case-info">Lance le dé</div>
    </div>
    <div class="box">
      <div class="box-t">Carte</div>
      <div id="card"><div class="no-c">Lance le dé puis pioche</div></div>
    </div>
    <div class="box">
      <div class="box-t">Pont DA · NA</div>
      <div id="pontda">— en attente —</div>
    </div>
    <div class="box">
      <div class="box-t">Scores</div>
      <div id="scores"></div>
    </div>
    <div class="box">
      <div class="box-t">Légende</div>
      <div class="leg">
        <div class="li"><div class="ld" style="background:#c0392b"></div>Rouge</div>
        <div class="li"><div class="ld" style="background:#2471a3"></div>Bleu</div>
        <div class="li"><div class="ld" style="background:#1e8449"></div>Vert</div>
        <div class="li"><div class="ld" style="background:#d68910"></div>Ressources</div>
        <div class="li"><div class="ld" style="background:#7d3c98"></div>Consultation</div>
      </div>
    </div>
  </div>
</div>
</div>

const PARC=[];
SEGS.forEach(s=>s.seq.forEach(c=>PARC.push({c,lbl:s.a})));
PARC.push({c:'FIN',lbl:'Cortex PF'});
const TOTAL=PARC.length;

const CNOM={R:'Zone Rouge',B:'Zone Bleue',V:'Zone Verte',J:'Ressources',C:'Consultation',FIN:'Arrivée'};

const SC={20:'#1e8449',10:'#2471a3',0:'#888',-10:'#d68910',-20:'#c0392b'};

  {t:'Mentorat',s:'Tu transmets ton savoir à un junior.',c:'Ocytocine + Dopamine sociale.',da:40,co:10,pts:20},

  {t:'Discussion Philo',s:'Parler du sens de la vie.',c:'Dopamine de sens.',da:30,co:10,pts:20},
],
J:[

  {t:'Le Mentor',s:'Une figure inspirante qui te guide.',c:'Externalisation de la décision.',da:40,co:10,pts:20,e:'Cartes Rouges : -10 DA ce tour.'},

  {t:'Sport Intensif',s:'Tu as transpiré fort.',c:'Évacue le surplus de cortisol.',da:40,co:10,pts:20,e:'Défausse toutes tes cartes Rouges.'},
  {t:'Repas en Famille',s:'On discute, on partage.',c:"Pic d'ocytocine.",da:40,co:10,pts:20,e:'Tous les joueurs +10 pts ce tour.'},
  {t:'Méditation Focus',s:'Tu observes tes pensées.',c:'Renfort préfrontal.',da:40,co:10,pts:20,e:'Ta prochaine Rouge ne dépasse pas -10.'},
  {t:'Sommeil de Qualité',s:'Chambre fraîche, sans écran.',c:'Système glymphatique optimisé.',da:40,co:10,pts:20,e:'Annule le prochain malus Descente.'},
],
C:[
  {t:'Consultation Addiction',s:'Admettre que le comportement a pris le dessus.',c:'Le premier pas est le plus difficile.',da:40,co:10,pts:20,p:"Demander de l'aide n'est pas perdre."},

  {t:'Décodage Émotionnel',s:"Mettre des mots sur l'émotion brute.",c:"Le langage calme l'amygdale.",da:40,co:20,pts:20,p:"Nommer, c'est reprendre 30% du contrôle."},
  {t:'Thérapie Cognitive',s:'Identifier tes biais de pensée.',c:'Restructuration cognitive.',da:40,co:20,pts:20,p:"Ce n'est pas la situation qui stresse."},
  {t:'Stage de Déconnexion',s:'Une semaine sans signal numérique.',c:'Resensibilisation des récepteurs D2.',da:40,co:10,pts:20,p:"Ce que tu retrouves sans écran, c'est toi."},
  {t:'Médiation de Conflit',s:"Vider l'abcès avec ton entourage.",c:"Baisse de l'alerte de menace sociale.",da:40,co:20,pts:20,p:"Un conflit non dit coûte de l'énergie."},
]
};

// Points SVG du parcours (viewBox 600x560)
const cx=300,cy=248,L=190;
const PTS_STAT={
  ATV:{x:cx,y:cy-L},
  HYP:{x:cx,y:cy},
  NA:{x:cx,y:cy+L*0.72},
  HIP:{x:cx+L,y:cy},
  AMY:{x:cx-L,y:cy},
  COR:{x:cx+L*0.8,y:cy+L*0.78}
};

function interp(a,b,n){
  return Array.from({length:n},(_,i)=>{const t=(i+.5)/n;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};});
}
const {ATV,HYP,NA,HIP,AMY,COR}=PTS_STAT;
const CASE_PTS=[
  ...interp(ATV,HYP,6),
  ...interp(HYP,NA,6),
  ...interp(NA,HIP,6),
  ...interp(HIP,HYP,6),
  ...interp(HYP,AMY,7),
  ...interp(AMY,COR,10),
  COR
];

// ÉTAT
let joueurs=Array.from({length:N},(_,i)=>({nom:PN[i],col:PC[i],score:0,pos:0}));
let jA=0,tour=1,dest=-1,carte=null,decks={};

function melangerDecks(){Object.keys(CARTES).forEach(k=>{decks[k]=[...CARTES[k]].sort(()=>Math.random()-.5)});}
function tirer(k){if(!decks[k]||!decks[k].length)decks[k]=[...CARTES[k]].sort(()=>Math.random()-.5);return decks[k].pop();}

function lancerDe(){
  const d=Math.floor(Math.random()*6)+1;
  dest=Math.min(joueurs[jA].pos+d,TOTAL-1);
  document.getElementById('die-show').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][d-1];
  document.getElementById('case-info').textContent='Case '+(dest+1)+' · '+(CNOM[PARC[dest].c]||'');
  document.getElementById('btn-die').disabled=true;
  document.getElementById('btn-draw').disabled=false;
  dessiner();
}

function piocher(){
  joueurs[jA].pos=dest;
  const cc=PARC[dest];
  if(cc.c==='FIN'){
    document.getElementById('card').innerHTML='<div style="text-align:center;padding:12px"><div style="font-size:28px">🧠</div><div style="font-size:14px;font-weight:bold;margin-top:6px">Cortex PF atteint !</div></div>';
    document.getElementById('btn-draw').disabled=true;
    document.getElementById('btn-next').disabled=false;
    dessiner();majScores();return;
  }
  const c=tirer(cc.c);
  carte={...c,fam:cc.c};
  joueurs[jA].score+=c.pts;
  majPontDA(c.co);
  afficherCarte(carte);
  document.getElementById('btn-draw').disabled=true;
  document.getElementById('btn-next').disabled=false;
  dessiner();majScores();
}

function majPontDA(co){
  const el=document.getElementById('pontda');
  if(co<40){el.style.background='#0a2e14';el.style.color='#52be80';el.textContent='Co<40 · Pont FERMÉ';}
  else if(co<=70){el.style.background='#2e1a00';el.style.color='#f0b27a';el.textContent='Co 40–70 · Pont ENTROUVERT';}
  else{el.style.background='#3d0a0a';el.style.color='#e74c3c';el.textContent='Co>70 · Pont FORCÉ !';}
}

function afficherCarte(c){
  const z=ZS[c.fam]||{bg:'#1a1a2e',col:'#aaa',n:'—'};
  const ec=c.da-c.co;
  const pc=SC[c.pts]||'#666';
  const pn=SN[c.pts]||'';
  let ex='';
  if(c.e)ex=`<div class="effet"><b>Effet :</b> ${c.e}</div>`;
  if(c.p)ex=`<div class="parole">"${c.p}"</div>`;
  document.getElementById('card').innerHTML=`
    <span class="badge" style="background:${z.bg};color:${z.col}">${z.n}${c.sub?' ■':''}</span>
    <div class="ctitle">${c.t}</div>
    <div class="csit">${c.s}</div>
    <div class="cbrain">${c.c}</div>
    <div class="pills"><span class="pill da">DA ${c.da>0?'+':''}${c.da}</span><span class="pill co">Co ${c.co>0?'+':''}${c.co}</span></div>
    <div style="font-size:10px;color:#666;margin-bottom:4px">Écart DA−Co = ${ec>0?'+':''}${ec}</div>
    <span class="score-pill" style="background:${pc}22;color:${pc}">${pn} ${c.pts>0?'+':''}${c.pts} pts</span>
    ${ex}`;
}

function tourSuivant(){
  jA=(jA+1)%N;if(jA===0)tour++;
  document.getElementById('turn').textContent='Tour '+tour+' · '+joueurs[jA].nom;
  document.getElementById('die-show').textContent='—';
  document.getElementById('case-info').textContent='Lance le dé';
  document.getElementById('card').innerHTML='<div class="no-c">Lance le dé puis pioche</div>';
  document.getElementById('pontda').style.background='#1a1a2e';
  document.getElementById('pontda').style.color='#666';
  document.getElementById('pontda').textContent='— en attente —';
  document.getElementById('btn-die').disabled=false;
  document.getElementById('btn-draw').disabled=true;
  document.getElementById('btn-next').disabled=true;
  dest=-1;dessiner();majScores();
}

function resetJeu(){
  joueurs=Array.from({length:N},(_,i)=>({nom:PN[i],col:PC[i],score:0,pos:0}));
  jA=0;tour=1;dest=-1;carte=null;
  melangerDecks();
  document.getElementById('turn').textContent='Tour 1 · Joueur 1';
  document.getElementById('die-show').textContent='—';
  document.getElementById('case-info').textContent='Lance le dé';
  document.getElementById('card').innerHTML='<div class="no-c">Lance le dé puis pioche</div>';
  document.getElementById('pontda').style.background='#1a1a2e';
  document.getElementById('pontda').style.color='#666';
  document.getElementById('pontda').textContent='— en attente —';
  document.getElementById('btn-die').disabled=false;
  document.getElementById('btn-draw').disabled=true;
  document.getElementById('btn-next').disabled=true;
  dessiner();majScores();
}

function majScores(){
  const st=pos=>{let c=0;for(let i=0;i<SEGS.length;i++){c+=SEGS[i].seq.length;if(pos<c)return SEGS[i].a;}return'Cortex PF';};
  document.getElementById('scores').innerHTML=joueurs.map((j,i)=>`
    <div class="prow${i===jA?' cur':''}">
      <div class="pdot" style="background:${j.col}"></div>
      <div class="pn">${j.nom}</div>
      <div class="pp">${st(j.pos)}</div>
      <div class="ps" style="color:${j.score>=0?'#52be80':'#e74c3c'}">${j.score>0?'+':''}${j.score}</div>
    </div>`).join('');
}

function dessiner(){
  const svg=document.getElementById('svg');
  let html='';

  // fond
  html+='<rect width="600" height="560" fill="#0d0d1a"/>';
  // grille déco
  for(let x=0;x<600;x+=40)html+=`<line x1="${x}" y1="0" x2="${x}" y2="560" stroke="rgba(255,255,255,0.02)"/>`;
  for(let y=0;y<560;y+=40)html+=`<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="rgba(255,255,255,0.02)"/>`;

  // bras
  function bras(a,b){html+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(255,255,255,0.06)" stroke-width="22" stroke-linecap="round"/>`;}
  bras(ATV,HYP);bras(HYP,NA);bras(NA,HIP);bras(HIP,HYP);bras(HYP,AMY);bras(AMY,COR);

  // Pont DA
  html+=`<polygon points="${NA.x},${NA.y} ${HIP.x-25},${HIP.y+45} ${COR.x},${COR.y-18}" fill="none" stroke="rgba(155,89,182,0.5)" stroke-width="1.5" stroke-dasharray="6,5"/>`;
  html+=`<text x="${NA.x+52}" y="${NA.y+24}" fill="#af7ac5" font-size="9" text-anchor="middle">Pont DA</text>`;

  // Cases
  CASE_PTS.forEach((p,i)=>{
    if(i>=PARC.length)return;
    const col=CCOL[PARC[i].c]||'#555';
    const isDest=i===dest;
    const r=isDest?12:8;
    if(isDest)html+=`<circle cx="${p.x}" cy="${p.y}" r="${r+7}" fill="${col}44"/>`;
    html+=`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${col}" stroke="rgba(0,0,0,0.5)" stroke-width="1"/>`;
    html+=`<text x="${p.x}" y="${p.y+3}" fill="rgba(255,255,255,0.8)" font-size="7" font-weight="bold" text-anchor="middle">${i+1}</text>`;
  });

  // Stations
  const STATS=[
    {p:ATV,l:'ATV',c:'#3498db'},
    {p:HYP,l:'Hypo',c:'#27ae60'},
    {p:NA,l:'NA',c:'#f39c12'},
    {p:HIP,l:'Hippo',c:'#8e44ad'},
    {p:AMY,l:'Amyg',c:'#e74c3c'},
    {p:COR,l:'Cortex',c:'#95a5a6'},
  ];
  STATS.forEach(st=>{
    html+=`<circle cx="${st.p.x}" cy="${st.p.y}" r="16" fill="${st.c}" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>`;
    html+=`<text x="${st.p.x}" y="${st.p.y+4}" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">${st.l}</text>`;
  });

  // Pions
  const OFF=[[-10,-10],[10,-10],[-10,10],[10,10],[0,-14],[0,14]];
  joueurs.forEach((j,i)=>{
    if(j.pos<0||j.pos>=CASE_PTS.length)return;
    const p=CASE_PTS[j.pos];
    const o=OFF[i]||[0,0];
    const px=p.x+o[0],py=p.y+o[1];
    const op=i===jA?'ff':'88';
    html+=`<circle cx="${px+1}" cy="${py+1}" r="8" fill="rgba(0,0,0,0.4)"/>`;
    html+=`<circle cx="${px}" cy="${py}" r="8" fill="${j.col}${op}" stroke="${i===jA?'#fff':'rgba(255,255,255,0.3)'}" stroke-width="${i===jA?2:1}"/>`;
    html+=`<text x="${px}" y="${py+3}" fill="#fff" font-size="7" font-weight="bold" text-anchor="middle">${i+1}</text>`;
  });

  svg.innerHTML=html;
}

melangerDecks();
majScores();
dessiner();
</script>
</body>
</html>
