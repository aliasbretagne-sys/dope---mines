<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dope à Mines — Voyage intercellulaire</title>
<style>
:root {
  --da: #00897B; --co: #1976D2; --indigo: #3D1A78;
  --da-light: #E0F2F1; --co-light: #E3F2FD; --ind-light: #EDE7F6;
  --bg: #F8F9FA; --bg2: #FFFFFF; --bg3: #F1F3F5;
  --border: #DEE2E6; --border2: #CED4DA;
  --text: #212529; --text2: #495057; --text3: #868E96;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
.app { max-width: 600px; margin: 0 auto; }
.main-nav { display: flex; align-items: center; border-bottom: 1.5px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 10; overflow-x: auto; }
.nav-home { padding: 10px 12px; cursor: pointer; font-size: 16px; border-bottom: 2px solid transparent; margin-bottom: -1.5px; flex-shrink: 0; border-right: 0.5px solid var(--border); }
.nav-home:hover { background: var(--ind-light); }
.nav-home.active { border-bottom-color: var(--indigo); background: var(--ind-light); }
.tab { padding: 10px 11px; font-size: 11px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1.5px; white-space: nowrap; flex-shrink: 0; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--indigo); border-bottom-color: var(--indigo); }
.page { padding: 16px; }
.sl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 0.5px solid var(--border); margin-top: 18px; }
.sl:first-of-type { margin-top: 0; }

/* GARDE */
.hero { text-align: center; padding: 20px 0 18px; border-bottom: 0.5px solid var(--border); margin-bottom: 18px; }
.hero-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text3); margin-bottom: 8px; }
.hero-title { font-size: 28px; font-weight: 500; color: var(--indigo); margin-bottom: 4px; }
.hero-voyage { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 12px; }
.hero-sub { font-size: 13px; color: var(--text2); margin-bottom: 14px; line-height: 1.6; max-width: 440px; margin-left: auto; margin-right: auto; }
.hero-citation { display: inline-block; padding: 10px 16px; border-radius: 10px; background: var(--ind-light); border-left: 3px solid var(--indigo); font-size: 12px; font-style: italic; color: var(--indigo); line-height: 1.6; text-align: left; max-width: 400px; }
.inpi-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border2); background: var(--bg3); font-size: 10px; color: var(--text3); }
.inpi-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--da); }
.circuits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cc { border-radius: 12px; padding: 13px; border: 0.5px solid var(--border); }
.cc.da { background: var(--da-light); border-color: var(--da); }
.cc.co { background: var(--co-light); border-color: var(--co); }
.cc-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cc-ico { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.cc.da .cc-ico { background: var(--da); }
.cc.co .cc-ico { background: var(--co); }
.cc-name { font-size: 12px; font-weight: 500; }
.cc.da .cc-name { color: var(--da); } .cc.co .cc-name { color: var(--co); }
.cc-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; }
.cc.da .cc-tag { color: var(--da); } .cc.co .cc-tag { color: var(--co); }
.cc-txt { font-size: 11px; color: var(--text2); line-height: 1.6; }
.cc-state { margin-top: 7px; padding: 5px 8px; border-radius: 7px; font-size: 10px; line-height: 1.6; }
.cc.da .cc-state { background: rgba(0,137,123,0.1); color: var(--da); }
.cc.co .cc-state { background: rgba(25,118,210,0.1); color: var(--co); }
.csl { font-weight: 600; }
.vg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vc { border-radius: 10px; padding: 12px; border: 0.5px solid var(--border); }
.vc.dan { background: var(--da-light); border-color: var(--da); }
.vc.dap { background: #E8F5E9; border-color: #43A047; }
.vc.con { background: var(--co-light); border-color: var(--co); }
.vc.cop { background: #FFEBEE; border-color: #E53935; }
.vb { display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; margin-bottom: 6px; }
.dan .vb { background: var(--da); color: #fff; } .dap .vb { background: #43A047; color: #fff; }
.con .vb { background: var(--co); color: #fff; } .cop .vb { background: #E53935; color: #fff; }
.vv { font-size: 11px; font-weight: 500; margin-bottom: 4px; }
.dan .vv { color: var(--da); } .dap .vv { color: #2E7D32; }
.con .vv { color: var(--co); } .cop .vv { color: #C62828; }
.vt { font-size: 10px; color: var(--text2); line-height: 1.5; }
.pont-garde { padding: 13px; border-radius: 12px; background: var(--ind-light); border: 0.5px solid var(--indigo); }
.pg-title { font-size: 13px; font-weight: 500; color: var(--indigo); margin-bottom: 7px; }
.pg-txt { font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 10px; }
.citations { display: flex; flex-direction: column; gap: 6px; }
.cit { padding: 8px 12px; border-radius: 8px; background: var(--bg2); border-left: 2px solid var(--indigo); font-size: 12px; font-style: italic; color: var(--indigo); line-height: 1.5; }

/* ONGLETS */
.oh { padding: 18px 16px; border-radius: 12px; margin-bottom: 18px; background: var(--indigo); text-align: center; }
.oh-ey { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.45); margin-bottom: 6px; }
.oh-ti { font-size: 17px; font-weight: 500; color: #fff; line-height: 1.4; margin-bottom: 10px; }
.oh-si { padding: 10px 14px; border-radius: 9px; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2); font-size: 12px; font-style: italic; color: rgba(255,255,255,0.9); line-height: 1.7; }
.bloc { padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; background: var(--bg3); border: 0.5px solid var(--border); }
.bl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 8px; }
.bt { font-size: 13px; color: var(--text2); line-height: 1.8; }
.bt strong { color: var(--text); font-weight: 500; }
.bloc.bleu { border-left: 3px solid var(--co); background: var(--co-light); } .bloc.bleu .bl { color: var(--co); }
.bloc.vert { border-left: 3px solid var(--da); background: var(--da-light); } .bloc.vert .bl { color: var(--da); }
.bloc.ind { border-left: 3px solid var(--indigo); background: var(--ind-light); } .bloc.ind .bl { color: var(--indigo); }
.cle { margin-top: 10px; padding: 10px 14px; border-radius: 9px; background: var(--bg2); border-left: 2px solid var(--indigo); font-size: 13px; font-style: italic; color: var(--indigo); line-height: 1.7; }
.pg { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
.pi { border-radius: 10px; padding: 13px 14px; border: 0.5px solid var(--border); background: var(--bg2); display: flex; gap: 12px; }
.pi-icon { font-size: 20px; flex-shrink: 0; }
.pi-name { font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.pi-txt { font-size: 12px; color: var(--text2); line-height: 1.6; }
.pi.neuro { border-color: var(--da); } .pi.neuro .pi-name { color: var(--da); }
.pi.peda { border-color: var(--co); } .pi.peda .pi-name { color: var(--co); }
.pi.human { border-color: #F9A825; } .pi.human .pi-name { color: #F57F17; }
.mg { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
.mi { padding: 10px 11px; border-radius: 9px; background: var(--bg3); border: 0.5px solid var(--border); }
.mi-name { font-size: 12px; font-weight: 600; color: var(--indigo); margin-bottom: 3px; }
.mi-txt { font-size: 11px; color: var(--text2); line-height: 1.5; }
.jg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jc { border-radius: 12px; padding: 14px; border: 0.5px solid var(--border); background: var(--bg2); }
.jb { display: inline-block; padding: 3px 9px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
.b-add { background: var(--da-light); color: var(--da); }
.b-pro { background: var(--co-light); color: var(--co); }
.b-scol { background: #FFF8E1; color: #F57F17; }
.b-hpro { background: var(--ind-light); color: var(--indigo); }
.jf { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 4px; }
.jn { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.jt { font-size: 11px; color: var(--text2); line-height: 1.6; }
.jtag { display: inline-block; margin-top: 8px; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 500; background: var(--bg3); color: var(--text3); }
.vl { display: flex; flex-direction: column; gap: 10px; }
.vi { border-radius: 12px; padding: 14px 16px; border: 0.5px solid var(--border); background: var(--bg2); display: flex; gap: 14px; }
.vn { font-size: 11px; font-weight: 700; min-width: 22px; padding-top: 2px; }
.vbd { flex: 1; }
.vtit { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.vtxt { font-size: 12px; color: var(--text2); line-height: 1.7; }
.vi.v1 { border-color: var(--da); background: var(--da-light); } .vi.v1 .vtit,.vi.v1 .vn { color: var(--da); }
.vi.v2 { border-color: var(--co); background: var(--co-light); } .vi.v2 .vtit,.vi.v2 .vn { color: var(--co); }
.vi.v3 { border-color: #F9A825; background: #FFF8E1; } .vi.v3 .vtit,.vi.v3 .vn { color: #F57F17; }
.vi.v4 { border-color: var(--indigo); background: var(--ind-light); } .vi.v4 .vtit,.vi.v4 .vn { color: var(--indigo); }
.sig { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--ind-light); border: 0.5px solid var(--indigo); text-align: center; }
.sig-txt { font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 10px; }
.sig-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.si { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 500; background: var(--bg2); border: 0.5px solid var(--indigo); color: var(--indigo); }

/* PARCOURS */
.pb { display: flex; margin-bottom: 18px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 10px; padding: 8px 12px; align-items: center; overflow-x: auto; }
.sd { font-size: 11px; color: var(--text3); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.sd.done { color: var(--da); cursor: pointer; }
.sd.active { background: var(--indigo); color: #fff; font-weight: 500; }
.ss { color: var(--border2); font-size: 10px; margin: 0 2px; }
.intro-box { padding: 13px 15px; border-radius: 10px; margin-bottom: 18px; background: var(--ind-light); border-left: 3px solid var(--indigo); border-top: 0.5px solid var(--border); border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); }
.intro-txt { font-size: 13px; color: var(--indigo); line-height: 1.7; font-style: italic; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rc { border: 0.5px solid var(--border); border-radius: 10px; padding: 11px 10px; cursor: pointer; background: var(--bg2); position: relative; min-height: 60px; }
.rc:hover { background: var(--bg3); }
.rc.sel-da { border: 1.5px solid var(--da); background: var(--da-light); }
.rc.sel-co { border: 1.5px solid var(--co); background: var(--co-light); }
.rc.sel-n { border: 1.5px solid #78909C; background: #ECEFF1; }
.rc-name { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.rc-txt { font-size: 11px; color: var(--text2); line-height: 1.4; }
.rc-badge { position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 8px; color: #fff; }
.seuil-row { display: flex; align-items: center; gap: 7px; margin: 8px 0 14px; }
.seuil-dots { display: flex; gap: 4px; }
.seuil-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.seuil-dot.filled { background: var(--indigo); }
.seuil-txt { font-size: 11px; color: var(--text3); }
.seuil-txt.ok { color: var(--da); }
.eq { margin-bottom: 12px; }
.eq-label { font-size: 12px; font-weight: 500; margin-bottom: 6px; }
.eq-opts { display: flex; gap: 5px; }
.eo { flex: 1; padding: 7px 4px; border-radius: 8px; border: 0.5px solid var(--border); font-size: 11px; text-align: center; cursor: pointer; background: var(--bg3); }
.eo:hover { border-color: var(--co); }
.eo.sel { background: var(--co-light); border-color: var(--co); color: var(--co); font-weight: 500; }
.iico { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border2); font-size: 9px; font-weight: 700; color: var(--text3); line-height: 14px; text-align: center; cursor: pointer; margin-top: 3px; }
.iico:hover { background: var(--ind-light); border-color: var(--indigo); color: var(--indigo); }
.ttip { display: none; margin-top: 5px; padding: 7px 10px; border-radius: 8px; background: var(--ind-light); border: 0.5px solid var(--indigo); font-size: 11px; color: var(--indigo); line-height: 1.5; }
.ttip.open { display: block; }
.pont-box { padding: 11px 13px; border-radius: 10px; margin-top: 12px; border: 0.5px solid var(--border); background: var(--bg3); }
.pont-box.ouvert { background: var(--da-light); border-color: var(--da); }
.pont-box.entrou { background: #FFF8E1; border-color: #F9A825; }
.pont-box.force { background: #FFEBEE; border-color: #E53935; }
.pl { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
.pl.ouvert { color: var(--da); } .pl.entrou { color: #F57F17; } .pl.force { color: #C62828; }
.pt { font-size: 12px; color: var(--text2); line-height: 1.5; }
.sm { display: flex; gap: 8px; margin-top: 12px; }
.sp { flex: 1; padding: 9px 8px; border-radius: 8px; text-align: center; }
.sp.da { background: var(--da-light); } .sp.co { background: var(--co-light); }
.spl { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
.sp.da .spl { color: var(--da); } .sp.co .spl { color: var(--co); }
.spv { font-size: 22px; font-weight: 500; line-height: 1; }
.sp.da .spv { color: var(--da); } .sp.co .spv { color: var(--co); }

/* UNIVERS MULTI-SELECTION */
.domaines-section { margin-bottom: 16px; }
.domaine-groupe { margin-bottom: 14px; }
.groupe-titre { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 8px; padding: 6px 10px; background: var(--bg3); border-radius: 7px; border: 0.5px solid var(--border); }
.domaine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.domaine-btn { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--bg2); cursor: pointer; font-size: 12px; transition: all 0.12s; }
.domaine-btn:hover { border-color: var(--border2); }
.domaine-btn.sel { border-width: 1.5px; font-weight: 500; }
.domaine-btn.sel-pro { background: #E3F2FD; border-color: #1565C0; color: #1565C0; }
.domaine-btn.sel-vie { background: #E8F5E9; border-color: #2E7D32; color: #2E7D32; }
.domaine-btn.sel-age { background: #F3E5F5; border-color: #6A1B9A; color: #6A1B9A; }
.db-check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.domaine-btn.sel .db-check { background: currentColor; border-color: currentColor; color: #fff !important; }
.db-icon { font-size: 16px; }
.db-name { font-size: 11px; }

/* ACTIVITES */
.activites-section { margin-bottom: 16px; }
.activ-domaine { margin-bottom: 14px; }
.activ-domaine-titre { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 10px; border-radius: 7px; margin-bottom: 8px; }
.activ-domaine-titre.pro { background: #E3F2FD; color: #1565C0; }
.activ-domaine-titre.vie { background: #E8F5E9; color: #2E7D32; }
.activ-domaine-titre.age { background: #F3E5F5; color: #6A1B9A; }
.activ-grid { display: flex; flex-direction: column; gap: 5px; }
.activ-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--bg2); cursor: pointer; font-size: 12px; }
.activ-item:hover { border-color: var(--border2); background: var(--bg3); }
.activ-item.sel { background: var(--da-light); border-color: var(--da); color: var(--da); font-weight: 500; }
.ac-check { width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; }
.activ-item.sel .ac-check { background: var(--da); border-color: var(--da); color: #fff; }
.nb-sits { font-size: 10px; color: var(--text3); margin-left: auto; }
.activ-item.sel .nb-sits { color: var(--da); }

/* FICHES */
.sb { display: flex; gap: 8px; margin-bottom: 14px; padding: 9px 12px; border-radius: 10px; background: var(--bg3); border: 0.5px solid var(--border); align-items: center; }
.gl { font-size: 11px; font-weight: 600; min-width: 22px; }
.gt { flex: 1; height: 5px; border-radius: 3px; background: var(--bg2); overflow: hidden; }
.gf { height: 100%; border-radius: 3px; transition: width 0.5s; }
.gv { font-size: 11px; font-weight: 500; min-width: 24px; text-align: right; }
.gsep { width: 0.5px; background: var(--border); height: 20px; margin: 0 4px; }
.dots-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); cursor: pointer; flex-shrink: 0; }
.dot.da-dot { background: var(--da); } .dot.co-dot { background: var(--co); } .dot.n-dot { background: #90A4AE; }
.dot.active { outline: 2px solid var(--indigo); outline-offset: 2px; }
.dlbl { font-size: 11px; color: var(--text3); margin-left: 4px; }
.fc { border: 0.5px solid var(--border); border-radius: 12px; padding: 13px; background: var(--bg2); margin-bottom: 10px; }
.fn-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.nb { width: 28px; height: 28px; border-radius: 7px; border: 0.5px solid var(--border2); background: var(--bg3); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.nb:hover { background: var(--ind-light); border-color: var(--indigo); }
.nb:disabled { opacity: 0.3; cursor: not-allowed; }
.fn { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
.fc-ctx { font-size: 11px; color: var(--text3); margin-bottom: 9px; }
.tr { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.tg { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
.tg-daco { background: var(--ind-light); color: var(--indigo); }
.tg-da { background: var(--da-light); color: var(--da); }
.tg-co { background: var(--co-light); color: var(--co); }
.tg-ouvert { background: var(--da-light); color: var(--da); }
.tg-entrou { background: #FFF8E1; color: #F57F17; }
.tg-force { background: #FFEBEE; color: #C62828; }
.tg-emo { background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border); }
.pm { padding: 7px 11px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; line-height: 1.5; }
.pm.ouvert { background: var(--da-light); color: var(--da); }
.pm.entrou { background: #FFF8E1; color: #F57F17; }
.pm.force { background: #FFEBEE; color: #C62828; }
.vq { font-size: 12px; color: var(--text2); margin-bottom: 7px; }
.vr { display: flex; gap: 6px; margin-bottom: 10px; }
.vb-btn { flex: 1; padding: 9px 4px; border-radius: 9px; border: 0.5px solid var(--border); background: var(--bg3); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--text2); }
.vb-btn.ad { background: var(--co-light); border-color: var(--co); color: var(--co); }
.vb-btn.an { background: #ECEFF1; border-color: #90A4AE; color: #546E7A; }

function ergoCo(){return S.ergo.reduce((s,v,i)=>s+(v!==null?ERGO[i].opts[v].val:0),0);}

function coScore(){return Math.min(100,ergoCo()+Object.values(S.sel).filter(v=>v<0).reduce((a,b)=>a+Math.abs(b),0));}
function pontInfo(co){
  if(co<40)return{cls:"ouvert",label:"Pont ouvert",txt:"Le cortex préfrontal est disponible. Le choix conscient reste possible."};
  if(co<=70)return{cls:"entrou",label:"Pont entrouvert",txt:"Zone d'alerte. La carte DA devient nécessaire avant de décider."};
  return{cls:"force",label:"Pont forcé",txt:"Co > 70 — ton cerveau ne peut plus choisir seul."};
}

    <div class="vi v4"><div class="vn">04</div><div class="vbd"><div class="vtit">L'humour comme vecteur pédagogique</div><div class="vtxt">On peut parler du cortisol en souriant. Le jeu, c'est d'abord un espace où l'on se permet de ne pas être sérieux — pour mieux comprendre ce qui l'est.</div></div></div>
  </div>
  <div class="sig"><div class="sig-txt">AliaSkill Formation · SIREN 888963238 · La Guerche-de-Bretagne</div><div class="sig-items"><span class="si">Maîtrise SIFA — Rennes 2 · 2025</span><span class="si">DU Addictologie — Rennes 1 · 2013</span><span class="si">PRAP IBC/INRS</span><span class="si">Fédération Addiction · depuis 2022</span><span class="si">35 ans de terrain</span></div></div>
  <button class="btn-start" onclick="startVoyage()">Commencer le voyage →</button>`;}

function startVoyage(){
  S={step:1,maxVisited:1,sel:{},ergo:[null,null,null],domainesSel:[],activitesSel:{},fiches:[],ficheIdx:0,votes:{},da:50,co:0};
  VIEW='voyage';render();
}

function nextStep(){S.step++;if(S.step>S.maxVisited)S.maxVisited=S.step;render();}

function renderVoyage(){
  const VSTEPS=[{id:1,label:"Auto-évaluation"},{id:2,label:"Mes domaines"},{id:3,label:"Mes activités"},{id:4,label:"Fiches"},{id:5,label:"Bilan"}];
  let pb=`<div class="pb"><span class="sd done" onclick="goView('home')" style="color:var(--indigo);margin-right:4px">🏠</span><span class="ss">›</span>
    ${VSTEPS.map((s,i)=>{let cls=s.id===S.step?'active':s.id<S.step?'done':'';const sep=i<VSTEPS.length-1?'<span class="ss">›</span>':'';return`<span class="sd ${cls}" style="cursor:${s.id<=S.maxVisited?'pointer':'default'}" onclick="${s.id<=S.maxVisited?`goVStep(${s.id})`:''}">${s.id}. ${s.label}</span>${sep}`;}).join('')}
  </div>`;
  if(S.step===1)return pb+renderVS1();
  if(S.step===2)return pb+renderVS2();
  if(S.step===3)return pb+renderVS3();
  if(S.step===4)return pb+renderVS4();
  if(S.step===5)return pb+renderVS5();
}

function goVStep(n){if(n<=S.maxVisited){S.step=n;render();}}

function renderVS1(){
  const done=Object.keys(S.sel).length,ergoDone=S.ergo.every(v=>v!==null);
  const da=daScore(),co=coScore(),allOk=done>=3&&ergoDone;
  let h=`<div class="sl" style="margin-top:0">Étape 1 — Auto-évaluation</div>
  <div style="font-size:19px;font-weight:500;margin-bottom:12px">Comment vas-tu là, maintenant ?</div>
  <div class="intro-box"><div class="intro-txt">Cette étape n'est pas un test. C'est un entraînement à regarder ce qui est là — en toi — avant même de commencer. Le ressenti n'est pas anecdotique. Ce n'est pas parce qu'on ne le voit pas qu'il n'existe pas. Il est souvent le premier signal. Prends le temps de l'écouter.</div></div>
  <div class="sl">Ressentis</div><div class="g2">`;
  h+=RS.map(r=>{const s=S.sel[r.key];const opt=s!==undefined?r.opts.find(o=>o.val===s):null;let cls=opt?(opt.daco==='DA'?'sel-da':opt.daco==='Co'?'sel-co':'sel-n'):'';const badge=opt?`<div class="rc-badge" style="background:${opt.col}">${opt.daco}</div>`:'';return`<div class="rc ${cls}" data-key="${r.key}">${badge}<div class="rc-name">${r.label}</div><div class="rc-txt">${opt?opt.txt:r.sub}</div></div>`;}).join('');
  h+=`</div><div class="seuil-row"><div class="seuil-dots">${[1,2,3].map(i=>`<div class="seuil-dot ${done>=i?'filled':''}"></div>`).join('')}</div><span class="seuil-txt ${done>=3?'ok':''}">${done>=3?`${done}/5 ressentis — tu peux continuer`:`Choisis au moins 3 ressentis pour poursuivre (${done}/3)`}</span></div>
  <div class="sl">Ergothermos — charge physique</div>`;
  h+=ERGO.map((q,i)=>`<div class="eq"><div class="eq-label">${q.label}</div><div class="eq-opts">${q.opts.map((o,j)=>`<div class="eo ${S.ergo[i]===j?'sel':''}" data-qi="${i}" data-ji="${j}"><span>${o.txt}</span><div class="iico" data-qi="${i}" data-ji="${j}" data-ref="${o.ref.replace(/"/g,'&quot;')}">ⓘ</div></div>`).join('')}</div><div class="ttip" id="tip-${i}"></div></div>`).join('');
  if(S.ergo.every(v=>v!==null)){const p2=pontInfo(co);h+=`<div class="pont-box ${p2.cls}"><div class="pl ${p2.cls}">${p2.label} — Co physiologique : ${ergoCo()}</div><div class="pt">${p2.txt}</div></div>`;}
  if(allOk)h+=`<div class="sm"><div class="sp da"><div class="spl">Dopamine</div><div class="spv">${da}</div></div><div class="sp co"><div class="spl">Cortisol</div><div class="spv">${co}</div></div></div>`;
  const missing=[];if(done<3)missing.push(`${3-done} ressenti${3-done>1?'s':''} de plus`);if(!S.ergo.every(v=>v!==null))missing.push('3 questions physiques');
  h+=`<button class="btn-next" ${!allOk?'disabled':''} onclick="nextStep()">Choisir mes domaines →</button><div class="hint">${allOk?'':'Encore : '+missing.join(' + ')}</div>`;
  return h;
}

function renderVS2(){
  let h=`<div class="sl" style="margin-top:0">Étape 2 — Mes domaines</div>
  <div style="font-size:19px;font-weight:500;margin-bottom:8px">Dans quels univers es-tu aujourd'hui ?</div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:16px">Coche un ou plusieurs domaines qui correspondent à ta journée.</div>
  <div class="domaines-section">`;
  PORTES.forEach(porte=>{
    h+=`<div class="domaine-groupe">
      <div class="groupe-titre">${porte.key==='pro'?'💼':porte.key==='vie'?'🏡':'🌱'} ${porte.label}</div>
      <div class="domaine-grid">`;
    porte.domaines.forEach(dom=>{
      const sel=S.domainesSel.includes(dom.key);
      h+=`<div class="domaine-btn ${sel?'sel-'+porte.cls:''}" data-dom="${dom.key}" data-cls="${porte.cls}">
        <div class="db-check">${sel?'✓':''}</div>
        <span class="db-icon">${dom.icon}</span>
        <span class="db-name">${dom.label}</span>
      </div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  if(S.domainesSel.length>0){
    h+=`<div class="resume-box"><strong>${S.domainesSel.length} domaine${S.domainesSel.length>1?'s':''} sélectionné${S.domainesSel.length>1?'s':''}</strong>${S.domainesSel.map(d=>{const dom=PORTES.flatMap(p=>p.domaines).find(x=>x.key===d);return dom?dom.label:d;}).join(' · ')}</div>`;
  }
  h+=`<button class="btn-next" ${S.domainesSel.length===0?'disabled':''} onclick="nextStep()">Choisir mes activités →</button>
  <div class="hint">${S.domainesSel.length===0?'Sélectionne au moins un domaine':''}</div>`;
  return h;
}

function renderVS3(){
  let h=`<div class="sl" style="margin-top:0">Étape 3 — Mes activités</div>
  <div style="font-size:19px;font-weight:500;margin-bottom:8px">Quelles activités as-tu faites aujourd'hui ?</div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:16px">Coche les activités qui correspondent à ta journée. Les fiches seront tirées de ces situations précises.</div>
  <div class="activites-section">`;

  S.domainesSel.forEach(domKey=>{
    const porte=PORTES.find(p=>p.domaines.some(d=>d.key===domKey));
    const dom=PORTES.flatMap(p=>p.domaines).find(d=>d.key===domKey);
    const cls=porte?porte.cls:'pro';
    const activites=ACTIVITES_DB[domKey]||[];
    if(!S.activitesSel[domKey])S.activitesSel[domKey]=[];
    h+=`<div class="activ-domaine">
      <div class="activ-domaine-titre ${cls}">${dom?dom.icon:''} ${dom?dom.label:domKey}</div>
      <div class="activ-grid">`;
    activites.forEach(activ=>{
      const sel=S.activitesSel[domKey].includes(activ);
      const nbSits=(SITUATIONS_DB[domKey]&&SITUATIONS_DB[domKey][activ])?SITUATIONS_DB[domKey][activ].length:0;
      h+=`<div class="activ-item ${sel?'sel':''}" data-dom="${domKey}" data-activ="${activ.replace(/"/g,'&quot;')}">
        <div class="ac-check">${sel?'✓':''}</div>
        <span>${activ}</span>
        <span class="nb-sits">${nbSits} sit.</span>
      </div>`;
    });
    h+=`</div></div>`;
  });

  h+=`</div>`;

  const totalSel=Object.values(S.activitesSel).reduce((s,a)=>s+a.length,0);
  if(totalSel>0){
    const totalSits=Object.entries(S.activitesSel).reduce((s,[dom,acts])=>{
      return s+acts.reduce((ss,a)=>ss+((SITUATIONS_DB[dom]&&SITUATIONS_DB[dom][a])?SITUATIONS_DB[dom][a].length:0),0);
    },0);
    h+=`<div class="resume-box"><strong>${totalSel} activité${totalSel>1?'s':''} · ${totalSits} situations disponibles</strong>Les fiches seront tirées aléatoirement parmi ces situations.</div>`;
  }

  h+=`<button class="btn-next" ${totalSel===0?'disabled':''} onclick="initFiches()">Commencer le voyage →</button>
  <div class="hint">${totalSel===0?'Coche au moins une activité':''}</div>`;
  return h;
}

function initFiches(){
  // Collecter toutes les situations des activités sélectionnées
  let pool=[];
  Object.entries(S.activitesSel).forEach(([dom,acts])=>{
    acts.forEach(activ=>{
      if(SITUATIONS_DB[dom]&&SITUATIONS_DB[dom][activ]){
        pool=pool.concat(SITUATIONS_DB[dom][activ]);
      }
    });
  });
  // Mélanger et prendre 10
  pool.sort(()=>Math.random()-0.5);
  S.fiches=pool.slice(0,Math.min(10,pool.length));
  S.ficheIdx=0;S.votes={};
  nextStep();
}

function renderVS4(){
  const da=S.da,co=S.co,fiches=S.fiches;
  if(!fiches||fiches.length===0)return`<div class="sl">Aucune fiche disponible</div>`;
  const voteCount=Object.keys(S.votes).length;
  const f=fiches[S.ficheIdx];
  const vote=S.votes[S.ficheIdx];
  const p=pontInfo(f.co||30);
  return`<div class="sl" style="margin-top:0">Étape 4 — Fiches</div>
  <div style="font-size:18px;font-weight:500;margin-bottom:12px">Reconnais tes situations</div>
  <div class="sb"><span class="gl" style="color:var(--da)">DA</span><div class="gt"><div class="gf" style="background:var(--da);width:${da}%"></div></div><span class="gv" style="color:var(--da)">${da}</span><div class="gsep"></div><span class="gl" style="color:var(--co)">Co</span><div class="gt"><div class="gf" style="background:var(--co);width:${co}%"></div></div><span class="gv" style="color:var(--co)">${co}</span></div>
  <div class="dots-row">${fiches.map((_,i)=>{const v=S.votes[i];const cls=v===1?'da-dot':v===-1?'co-dot':v===0?'n-dot':'';return`<div class="dot ${cls} ${i===S.ficheIdx?'active':''}" data-i="${i}"></div>`;}).join('')}<span class="dlbl">${S.ficheIdx+1} / ${fiches.length}</span></div>
  <div class="fc">
    <div class="fn-row"><div style="display:flex;gap:6px"><button class="nb" id="btnPrev" ${S.ficheIdx===0?'disabled':''}>‹</button><button class="nb" id="btnNxt2" ${S.ficheIdx===fiches.length-1?'disabled':''}>›</button></div><span style="font-size:12px;color:var(--text3)">${voteCount} / ${fiches.length} votées</span></div>
    <div class="fn">${f.nom}</div><div class="fc-ctx">${f.ctx}</div>
    <div class="tr"><span class="tg tg-daco">${f.daco||'DACO'}</span><span class="tg tg-da">DA ${f.da||'—'}</span><span class="tg tg-co">Co ${f.co||'—'}</span><span class="tg tg-${f.pont||'entrou'}">${pontLabel(f.pont||'entrou')}</span>${f.emotion?`<span class="tg tg-emo">${f.emotion}</span>`:''}</div>
    <div class="pm ${p.cls}"><strong>${p.label}</strong> — ${p.txt}</div>
    <div class="vq">Cette situation, comment elle résonne pour toi ?</div>
    <div class="vr"><button class="vb-btn ${vote===-1?'ad':''}" id="vDown"><span class="va">⬇</span>Ça coûte</button><button class="vb-btn ${vote===0?'an':''}" id="vN"><span class="va">→</span>Neutre</button><button class="vb-btn ${vote===1?'au':''}" id="vUp"><span class="va">⬆</span>Ça nourrit</button></div>
    ${vote!==undefined&&(f.corps||f.lien||f.pensee)?`<div class="rb"><div class="rt">Ressources — ${f.daco||''}</div>${f.corps?`<div class="rr"><span class="rl corps">I Corps</span><span class="rtxt">${f.corps}</span></div>`:''}${f.lien?`<div class="rr"><span class="rl lien">II Lien</span><span class="rtxt">${f.lien}</span></div>`:''}${f.pensee?`<div class="rr"><span class="rl pensee">III Pensée</span><span class="rtxt">${f.pensee}</span></div>`:''}</div>`:''}
  </div>
  <button class="btn-next" ${voteCount<3?'disabled':''} onclick="nextStep()">Voir mon bilan →</button>
  <div class="hint">${voteCount<3?`Vote sur ${3-voteCount} fiche${3-voteCount>1?'s':''} de plus`:''}</div>`;}

function renderVS5(){
  const da=S.da,co=S.co,p=pontInfo(co),fiches=S.fiches;
  const ilots=fiches.filter((_,i)=>S.votes[i]===1);
  const charges=fiches.filter((_,i)=>S.votes[i]===-1);
  return`<div class="sl" style="margin-top:0">Étape 5 — Bilan</div>
  <div style="font-size:19px;font-weight:500;margin-bottom:12px">Ce que ton cerveau a traversé</div>
  <div class="bs"><div class="sc da"><div class="scl">Dopamine</div><div class="scv">${da}</div><div class="scs">sur 100</div></div><div class="sc co"><div class="scl">Cortisol</div><div class="scv">${co}</div><div class="scs">sur 100</div></div></div>
  <div class="gr"><span class="gl" style="color:var(--da)">DA</span><div class="gt"><div class="gf" style="background:var(--da);width:${da}%"></div></div><span class="gv" style="color:var(--da)">${da}</span></div>
  <div class="gr"><span class="gl" style="color:var(--co)">Co</span><div class="gt"><div class="gf" style="background:var(--co);width:${co}%"></div></div><span class="gv" style="color:var(--co)">${co}</span></div>
  <div class="pont-box ${p.cls}" style="margin:14px 0"><div class="pl ${p.cls}">${p.label} — Co ${co}</div><div class="pt">${p.txt}</div></div>
  ${ilots.length>0?`<div class="sl">Îlots de DA — tes situations nourrissantes</div><div class="ig">${ilots.map(f=>`<div class="ii"><span>⬆</span>${f.nom}</div>`).join('')}</div>`:''}
  <div class="sl">Situations coûteuses — tes ressources</div>
  ${charges.length>0?charges.map(f=>`<div class="ci"><div class="ch"><span>⬇</span>${f.nom}</div>${f.corps?`<div class="rr"><span class="rl corps">I Corps</span><span class="rtxt">${f.corps}</span></div>`:''}${f.lien?`<div class="rr"><span class="rl lien">II Lien</span><span class="rtxt">${f.lien}</span></div>`:''}${f.pensee?`<div class="rr"><span class="rl pensee">III Pensée</span><span class="rtxt">${f.pensee}</span></div>`:''}</div>`).join(''):`<div style="font-size:12px;color:var(--text3);padding:6px 0">Aucune situation coûteuse identifiée — bien joué.</div>`}
  <div class="pe"><div class="pe-txt">"Ce score ne te mesure pas.<br>Il raconte ce que ton cerveau a traversé."</div><div class="pe-sig">DOPE À MINES · INPI n°5238107 · AliaSkill Formation · Xavier Gautron © 2026</div></div>
  <div class="btns-row"><button class="btn-sec" onclick="startVoyage()">Nouveau voyage</button><button class="btn-pri" onclick="goView('home')">🏠 Accueil</button></div>`;}

function attachVoyageEvents(){
  document.querySelectorAll('.rc[data-key]').forEach(el=>el.addEventListener('click',()=>openModal(el.dataset.key)));
  document.querySelectorAll('.eo[data-qi]').forEach(el=>el.addEventListener('click',(e)=>{if(e.target.classList.contains('iico'))return;S.ergo[+el.dataset.qi]=+el.dataset.ji;render();}));
  document.querySelectorAll('.iico[data-ref]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const qi=el.dataset.qi;const tip=document.getElementById('tip-'+qi);const isOpen=tip.classList.contains('open')&&tip.dataset.ji===el.dataset.ji;document.querySelectorAll('.ttip').forEach(t=>{t.classList.remove('open');t.textContent='';});if(!isOpen){tip.textContent=el.dataset.ref;tip.dataset.ji=el.dataset.ji;tip.classList.add('open');}}));
  document.querySelectorAll('.domaine-btn[data-dom]').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.dom;if(S.domainesSel.includes(k))S.domainesSel=S.domainesSel.filter(x=>x!==k);else S.domainesSel.push(k);render();}));
  document.querySelectorAll('.activ-item[data-activ]').forEach(el=>el.addEventListener('click',()=>{
    const dom=el.dataset.dom,activ=el.dataset.activ;
    if(!S.activitesSel[dom])S.activitesSel[dom]=[];
    if(S.activitesSel[dom].includes(activ))S.activitesSel[dom]=S.activitesSel[dom].filter(x=>x!==activ);
    else S.activitesSel[dom].push(activ);
    render();
  }));
  document.querySelectorAll('.dot[data-i]').forEach(el=>el.addEventListener('click',()=>{S.ficheIdx=+el.dataset.i;render();}));
  const bp=document.getElementById('btnPrev');if(bp)bp.addEventListener('click',()=>{if(S.ficheIdx>0){S.ficheIdx--;render();}});
  const bn=document.getElementById('btnNxt2');if(bn)bn.addEventListener('click',()=>{if(S.ficheIdx<S.fiches.length-1){S.ficheIdx++;render();}});
  const vd=document.getElementById('vDown');if(vd)vd.addEventListener('click',()=>doVote(-1));
  const vn=document.getElementById('vN');if(vn)vn.addEventListener('click',()=>doVote(0));
  const vu=document.getElementById('vUp');if(vu)vu.addEventListener('click',()=>doVote(1));
}

function doVote(v){
  S.votes[S.ficheIdx]=v;
  const f=S.fiches[S.ficheIdx];
  if(v===1)S.da=Math.min(100,Math.round(S.da+(f.da||10)/10));
  if(v===-1)S.co=Math.min(100,Math.round(S.co+(f.co||10)/10));
  render();
  if(S.ficheIdx<S.fiches.length-1)setTimeout(()=>{S.ficheIdx++;render();},380);
}

function openModal(key){
  const r=RS.find(x=>x.key===key);
  document.getElementById('mt').textContent=r.label+' — '+r.sub;
  document.getElementById('mo').innerHTML=r.opts.map((o,i)=>`<div class="ow"><div style="display:flex;gap:6px;align-items:center"><button class="op" style="flex:1" onclick="pick('${key}',${o.val})"><div class="od" style="background:${o.col}"></div><span>${o.txt}</span><span class="ot" style="color:${o.col}">${o.daco}</span></button><div class="oi" onclick="toggleTip2('mtip-${key}-${i}')">ⓘ</div></div><div class="ttip" id="mtip-${key}-${i}">${o.ref}</div></div>`).join('');
  document.getElementById('mw').classList.add('open');
}
function toggleTip2(id){const el=document.getElementById(id);const isOpen=el.classList.contains('open');document.querySelectorAll('.ttip').forEach(t=>t.classList.remove('open'));if(!isOpen)el.classList.add('open');}
function pick(key,val){S.sel[key]=val;closeModal();render();}
function closeModal(){document.getElementById('mw').classList.remove('open');document.querySelectorAll('.ttip').forEach(t=>t.classList.remove('open'));}

render();
</script>
</body>
